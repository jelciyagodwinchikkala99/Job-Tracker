<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Job application tracker</h1>
    <p class="sub">Log each application and update its status as you hear back.</p>

    <section id="stats"></section>
<div class="chart-box">
  <canvas id="status-chart"></canvas>
  <p id="chart-empty" class="chart-empty" hidden>No applications yet. Add one or load sample data.</p>
</div>
    <form id="app-form">
      <label>Company <input id="company" required></label>
      <label>Role <input id="role" required></label>
      <label>Location <input id="location" placeholder="City, State or Remote"></label>
      <label>Date applied <input id="date" type="date" required></label>
      <label>Status
        <select id="status">
          <option>Applied</option>
          <option>Interview</option>
          <option>Offer</option>
          <option>Rejected</option>
        </select>
      </label>
      <button type="submit">Add application</button>
    </form>
<div class="toolbar">
  <input id="search" placeholder="Search company, role, or location">
  <select id="filter">
    <option>All</option>
    <option>Applied</option>
    <option>Interview</option>
    <option>Offer</option>
    <option>Rejected</option>
  </select>
  <button type="button" id="load-sample">Load sample data</button>
</div>
    <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Role</th>
          <th>Location</th>
          <th>Applied</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
